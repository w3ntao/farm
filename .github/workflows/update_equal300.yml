name: update_equal300

on:
  #push: # don't trigger workflow from push
  #  branches: ["main"]

  workflow_dispatch:

  schedule:
    - cron: "0 17 * * 5"
    # runs at 01:00 every Saturday, Beijing time
    # 17:00 UTC Friday = 01:00 Beijing Saturday
    # cron may be delayed by GitHub Actions

permissions:
  contents: write
  # so github bot could commit changes

jobs:
  update-equal-300:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash # now you can use pushd and popd

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: install dependencies
        run: |
          pip install --upgrade -r requirements.txt

      - name: Set DATE variable
        env:
          TZ: Asia/Shanghai
        run: |
          echo "STOCK_DATE=$(python market_utility.py --last_stock_date)" >> $GITHUB_ENV

      - name: clone quant-tracer
        uses: actions/checkout@v4
        with:
          repository: w3ntao/quant-tracer
          token: ${{ secrets.KEY_QUANT_TRACER_RECUR }}
          path: quant-tracer
          fetch-depth: 0 # download full history
          submodules: recursive
          persist-credentials: true

      - name: prepare quant-tracer
        run: |
          sudo apt install -y attr
          pip install --upgrade -r quant-tracer/requirements.txt

          pushd quant-tracer/index_history
          git pull --ff-only origin main
          popd

      - name: trace equal
        run: |
          pushd quant-tracer

          timeout 1h python quant_tracer.py --equal50
          mv kechuang50_*.png ../equal50

          timeout 1h python quant_tracer.py --equal100
          mv zhongzheng100_*.png ../equal100

          timeout 2h python quant_tracer.py --equal300
          mv hushen300_*.png ../equal300

          popd

      - name: archive stock cache
        run: |
          pushd quant-tracer

          mv cache/${STOCK_DATE} cache/new-${STOCK_DATE}

          python quant_tracer.py --download_cache

          cd cache

          mv new-${STOCK_DATE}/* ${STOCK_DATE}/

          zip -r ${GITHUB_WORKSPACE}/${STOCK_DATE}.zip ${STOCK_DATE}

          popd

      - name: publish stock cache release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.STOCK_DATE }}
          name: cache-${{ env.STOCK_DATE }}
          body: |
            daily cache: ${{ env.STOCK_DATE }}
          files: ${{ env.STOCK_DATE }}.zip

      - name: commit changes
        env:
          TZ: Asia/Shanghai
        run: |
          git config user.name "Wentao Liu"
          git config user.email "wentao.liu.zero@outlook.com"

          git add equal*

          if git diff --cached --quiet; then
            echo "No changes to commit, skipping push."

            exit 0
          fi

          git commit -m "[ci-bot] weekly equal300: ${STOCK_DATE}"

          for attempt in 1 2 3 4 5; do
            git fetch origin main

            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi

            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done

          echo "Failed to push changes after multiple attempts."
          exit 1
