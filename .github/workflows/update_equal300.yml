name: update_equal300

on:
  workflow_dispatch:

  schedule:
    - cron: "0 17 * * 5"
    # runs at 01:00 every Saturday, Beijing time

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: clone quant-tracer
        uses: actions/checkout@v4
        with:
          repository: w3ntao/quant-tracer
          token: ${{ secrets.KEY_QUANT_TRACER_RECUR }}
          path: quant-tracer
          fetch-depth: 0
          submodules: recursive
          persist-credentials: true

      - name: prepare quant-tracer
        run: |
          bash quant-tracer/configure.sh

      - name: trace equal
        run: |
          pushd quant-tracer
          timeout 1h python quant_tracer.py --equal50
          mv kechuang50_*.png ../equal50
          timeout 1h python quant_tracer.py --equal100
          mv zhongzheng100_*.png ../equal100
          timeout 1h python quant_tracer.py --equal300
          mv hushen300_*.png ../equal300
          popd

      - name: commit changes
        run: |
          git add equal*
          python quant-tracer/github_helper.py -commit "[ci-bot] weekly equal300"
