name: daily_trigger

on:
  schedule:
    - cron: "0 10 * * 1-5"
    # runs at 10:00 UTC, Monday through Friday
    # 10:00 UTC -> 18:00 (+ 01:00) Beijing
    # cron is usually delayed by 1 hour

  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch-subtasks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - uses: actions/checkout@v4

      - name: Dispatch daily subtasks
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_REF: ${{ github.ref_name }}
        run: |
          python -m pip install chinesecalendar
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]] && ! python trade_today.py; then
            echo "Today is not a trading day; skipping scheduled dispatches."
            exit 0
          fi

          failed=0

          for workflow in \
            update_lowpe.yml \
            update_lowvol.yml \
            update_trend1000.yml \
            update_temperature.yml
          do
            echo "Dispatching ${workflow} on ${TARGET_REF}"
            if ! gh workflow run "${workflow}" --ref "${TARGET_REF}"; then
              echo "::error title=Workflow dispatch failed::Could not dispatch ${workflow}"
              failed=1
            fi
          done

          exit "${failed}"
