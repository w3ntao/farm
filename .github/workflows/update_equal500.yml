name: update_equal500

on:
  #push: # don't trigger workflow from push
  #  branches: ["main"]

  workflow_dispatch:

  workflow_run:
    workflows: ["update_equal300"] # triggered by equal 300
    types:
      - completed

permissions:
  contents: write
  # so github bot could commit changes

concurrency:
  group: main-repository-updates
  queue: max
  cancel-in-progress: false

jobs:
  update-equal-500:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash # now you can use pushd and popd

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: install dependencies
        run: |
          pip install --upgrade -r requirements.txt

      - name: Set DATE variable
        env:
          TZ: Asia/Shanghai
        run: |
          echo "STOCK_DATE=$(python market_utility.py --last_stock_date)" >> $GITHUB_ENV

      - name: clone quant-tracer
        uses: actions/checkout@v4
        with:
          repository: w3ntao/quant-tracer
          token: ${{ secrets.KEY_QUANT_TRACER_RECUR }}
          path: quant-tracer
          fetch-depth: 0 # download full history
          submodules: recursive
          persist-credentials: true

      - name: prepare quant-tracer
        run: |
          sudo apt install -y attr
          pip install --upgrade -r quant-tracer/requirements.txt

          pushd quant-tracer/index-history
          git pull --ff-only origin main
          popd

      - name: trace equal
        run: |
          pushd quant-tracer

          timeout 2h python quant_tracer.py --equal500
          mv zhongzheng500_*.png ../equal500

          popd

      - name: archive stock cache
        run: |
          pushd quant-tracer

          mv cache/${STOCK_DATE} cache/new-${STOCK_DATE}

          python quant_tracer.py --download_cache

          cd cache

          mv new-${STOCK_DATE}/* ${STOCK_DATE}/

          zip -r ${GITHUB_WORKSPACE}/${STOCK_DATE}.zip ${STOCK_DATE}

          popd

      - name: publish stock cache release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.STOCK_DATE }}
          name: cache-${{ env.STOCK_DATE }}
          body: |
            daily cache: ${{ env.STOCK_DATE }}
          files: ${{ env.STOCK_DATE }}.zip

      - name: commit changes
        env:
          TZ: Asia/Shanghai
        run: |
          git config user.name "Wentao Liu"
          git config user.email "wentao.liu.zero@outlook.com"

          git add -A -- equal500

          if git diff --cached --quiet; then
            echo "No changes to commit, skipping push."

            exit 0
          fi

          git commit -m "[ci-bot] weekly equal500: ${STOCK_DATE}"

          for attempt in 1 2 3 4 5; do
            git fetch origin main

            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi

            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done

          echo "Failed to push changes after multiple attempts."
          exit 1
