name: update_equal500

on:
  workflow_dispatch:

  workflow_run:
    workflows: ["update_equal300"]
    types:
      - completed

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: clone quant-tracer
        uses: actions/checkout@v4
        with:
          repository: w3ntao/quant-tracer
          token: ${{ secrets.KEY_QUANT_TRACER_RECUR }}
          path: quant-tracer
          fetch-depth: 0
          submodules: recursive
          persist-credentials: true

      - name: prepare quant-tracer
        run: |
          bash quant-tracer/configure.sh

      - name: trace equal
        run: |
          pushd quant-tracer
          timeout 2h python quant_tracer.py --equal500
          mv zhongzheng500_*.png ../equal500
          popd

      - name: commit changes
        run: |
          git add equal*
          python quant-tracer/github_helper.py -commit "[ci-bot] weekly equal500"
