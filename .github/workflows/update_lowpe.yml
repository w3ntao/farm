name: update_lowpe

on:
  #push: # don't trigger workflow from push
  #  branches: ["main"]

  workflow_dispatch:

  workflow_run:
    workflows: ["update_lowvol"]
    types:
      - completed

permissions:
  contents: write
  # so github bot could commit changes

jobs:
  update-lowpe:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash # now you can use pushd and popd

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: install dependencies
        run: |
          pip install --upgrade -r requirements.txt

      - name: Set DATE variable
        env:
          TZ: Asia/Shanghai
        run: |
          echo "STOCK_DATE=$(python market_utility.py --last_stock_date)" >> $GITHUB_ENV

      - name: clone quant-tracer
        run: |
          git clone https://x-access-token:${{ secrets.KEY_QUANT_TRACER }}@github.com/w3ntao/quant-tracer.git
          sudo apt install -y attr
          pip install --upgrade -r quant-tracer/requirements.txt

      - name: trace stocks
        run: |
          pushd quant-tracer
          python quant_tracer.py

          timeout 1h python quant_tracer.py --lowpe > "../lowpe/lowpe_stocks.txt"

          popd

      - name: commit changes
        env:
          TZ: Asia/Shanghai
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit, skipping push."

            exit 0
          fi

          git config user.name "Wentao Liu"
          git config user.email "wentao.liu.zero@outlook.com"

          git pull
          git add -u

          git commit -m "[ci-bot] daily low PE: ${STOCK_DATE}"
          git push -u origin main
