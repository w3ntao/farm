name: update_temperature

on:
  #push: # don't trigger workflow from push
  #  branches: ["main"]

  workflow_dispatch:

  workflow_run:
    workflows: ["daily_trigger"]
    types:
      - completed

permissions:
  contents: write
  # so github bot could commit changes

jobs:
  update-temperature:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash # now you can use pushd and popd

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: install dependencies
        run: |
          pip install --upgrade -r requirements.txt

      - name: Set DATE variable
        env:
          TZ: Asia/Shanghai
        run: |
          echo "STOCK_DATE=$(python market_utility.py --last_stock_date)" >> $GITHUB_ENV

      - name: clone quant-tracer
        uses: actions/checkout@v4
        with:
          repository: w3ntao/quant-tracer
          token: ${{ secrets.KEY_QUANT_TRACER_RECUR }}
          path: quant-tracer
          fetch-depth: 0 # download full history
          submodules: recursive
          persist-credentials: true

      - name: prepare quant-tracer
        run: |
          sudo apt install -y attr
          pip install --upgrade -r quant-tracer/requirements.txt

          pushd quant-tracer/index_history
          git pull --ff-only origin main
          popd

      - name: trace stocks
        run: |
          pushd quant-tracer
          python quant_tracer.py

          timeout 1h python quant_tracer.py --temperature
          mv temperature_*.png ../temperature

          popd

      - name: commit changes
        env:
          TZ: Asia/Shanghai
        run: |
          git config user.name "Wentao Liu"
          git config user.email "wentao.liu.zero@outlook.com"

          git add -A -- temperature

          if git diff --cached --quiet; then
            echo "No changes to commit, skipping push."

            exit 0
          fi

          git commit -m "[ci-bot] daily temperature: ${STOCK_DATE}"

          for attempt in 1 2 3 4 5; do
            git fetch origin main

            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi

            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done

          echo "Failed to push changes after multiple attempts."
          exit 1
