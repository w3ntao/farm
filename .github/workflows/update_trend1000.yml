name: update_trend1000

on:
  schedule:
    - cron: "0 9 * * *"
    # runs on 9:00 of everyday
    # 9:00 UTC = 17:00 Beijing
    # cron is usually delayed so it would probably start around 18:00
  workflow_dispatch:

permissions:
  contents: write
  # so github bot could commit changes

jobs:
  update-trend-1000:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash # now you can use pushd and popd

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: install dependencies
        run: |
          pip install --upgrade -r requirements.txt

      - name: Set DATE variable
        env:
          TZ: Asia/Shanghai
        run: |
          echo "STOCK_DATE=$(python market_utility.py --last_stock_date)" >> $GITHUB_ENV

      - name: clone quant-tracer
        run: |
          git clone https://x-access-token:${{ secrets.KEY_QUANT_TRACER }}@github.com/w3ntao/quant-tracer.git
          pip install --upgrade -r quant-tracer/requirements.txt

      - name: trace stocks
        run: |
          pushd quant-tracer
          python quant_tracer.py

          timeout 2h python quant_tracer.py --trend1000
          timeout 5m python quant_tracer.py --trend1000 > "../trend1000/trend1000.txt"

          popd

      - name: archive stock cache
        run: |
          pushd quant-tracer

          mv cache/${STOCK_DATE} cache/new-${STOCK_DATE}

          python quant_tracer.py --download_cache

          cd cache

          mv new-${STOCK_DATE}/* ${STOCK_DATE}/

          zip -r ${GITHUB_WORKSPACE}/${STOCK_DATE}.zip ${STOCK_DATE}

          popd

      - name: publish stock cache release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.STOCK_DATE }}
          name: cache-${{ env.STOCK_DATE }}
          body: |
            daily cache: ${{ env.STOCK_DATE }}
          files: ${{ env.STOCK_DATE }}.zip

      - name: commit changes
        env:
          TZ: Asia/Shanghai
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit, skipping push."

            exit 0
          fi

          git config user.name "Wentao Liu"
          git config user.email "wentao.liu.zero@outlook.com"

          git pull
          git add trend*

          git commit -m "[ci-bot] weekly trend1000: ${STOCK_DATE}"
          git push -u origin main
